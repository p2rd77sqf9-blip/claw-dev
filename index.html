<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Reactive Visualizer</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --c1: #00ffff;
            --c2: #ff00ff;
            --c1-rgb: 0,255,255;
        }

        body {
            background: #080810;
            color: #fff;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── Start Screen ── */
        #start {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 55%, #0d0d22 0%, #080810 68%);
        }

        #start-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .start-inner {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 0 24px;
        }

        .start-title {
            font-size: clamp(2.8rem, 7vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.05;
            margin-bottom: 10px;
        }

        .start-sub {
            color: rgba(255,255,255,0.36);
            font-size: 1rem;
            margin-bottom: 48px;
            letter-spacing: 0.02em;
        }

        .start-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0,255,255,0.13), rgba(255,0,255,0.13));
            border: 1px solid rgba(0,255,255,0.45);
            color: #fff;
            padding: 13px 36px;
            border-radius: 100px;
            font-size: 0.93rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.04em;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(0,255,255,0.26), rgba(255,0,255,0.26));
            border-color: rgba(0,255,255,0.9);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,255,255,0.18);
        }

        .btn-file {
            color: rgba(255,255,255,0.38);
            font-size: 0.84rem;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s;
        }

        .btn-file:hover { color: rgba(255,255,255,0.7); }

        .start-hint {
            margin-top: 40px;
            color: rgba(255,255,255,0.18);
            font-size: 0.74rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        /* ── HUD ── */
        #hud {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        #hud.show { opacity: 1; }
        body.idle #hud { opacity: 0; }

        .hud-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hud-stats {
            font-size: 10px;
            color: rgba(255,255,255,0.26);
            margin-top: 3px;
            letter-spacing: 0.04em;
        }

        /* ── Controls ── */
        #controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 28px 28px 20px;
            display: none;
            flex-direction: column;
            gap: 9px;
            background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        #controls.show { display: flex; opacity: 1; }
        body.idle #controls { opacity: 0; pointer-events: none; }

        .ctrl-row {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
        }

        .ctrl-lbl {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.28);
            text-transform: uppercase;
            width: 70px;
            flex-shrink: 0;
        }

        .btn-grp { display: flex; gap: 5px; }

        .btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.52);
            padding: 6px 14px;
            border-radius: 100px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.18s;
            letter-spacing: 0.03em;
            white-space: nowrap;
        }

        .btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .btn.on {
            background: rgba(var(--c1-rgb), 0.16);
            border-color: rgba(var(--c1-rgb), 0.65);
            color: var(--c1);
        }

        .theme-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .theme-dot:hover { transform: scale(1.15); }

        .theme-dot.on {
            border-color: rgba(255,255,255,0.8);
            transform: scale(1.28);
            box-shadow: 0 0 10px rgba(255,255,255,0.25);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 86px;
            height: 3px;
            background: rgba(255,255,255,0.12);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            background: var(--c1);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px var(--c1);
        }

        .sep {
            width: 1px;
            height: 18px;
            background: rgba(255,255,255,0.09);
            margin: 0 3px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.45);
            width: 28px;
            height: 28px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
            font-size: 13px;
            flex-shrink: 0;
        }

        .icon-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .val-badge {
            font-size: 10px;
            color: rgba(255,255,255,0.28);
            min-width: 28px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Start screen -->
    <div id="start">
        <canvas id="start-canvas"></canvas>
        <div class="start-inner">
            <div class="start-title">Visualizer</div>
            <div class="start-sub">Real-time audio frequency analysis</div>
            <div class="start-actions">
                <button class="btn-primary" id="mic-btn">Use Microphone</button>
                <label class="btn-file">
                    or upload audio file
                    <input type="file" id="file-input" accept="audio/*" style="display:none">
                </label>
            </div>
            <div class="start-hint">1-6 = modes &nbsp;·&nbsp; Q-T = themes &nbsp;·&nbsp; +/− = sensitivity &nbsp;·&nbsp; F = fullscreen</div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-title">Visualizer</div>
        <div class="hud-stats" id="hud-stats">Level: — &nbsp;·&nbsp; Bass: —</div>
    </div>

    <!-- Controls -->
    <div id="controls">
        <div class="ctrl-row">
            <span class="ctrl-lbl">Mode</span>
            <div class="btn-grp" id="mode-btns">
                <button class="btn on" data-mode="bars">1 · Bars</button>
                <button class="btn" data-mode="wave">2 · Wave</button>
                <button class="btn" data-mode="radial">3 · Radial</button>
                <button class="btn" data-mode="nebula">4 · Nebula</button>
                <button class="btn" data-mode="fractal">5 · Fractal</button>
                <button class="btn" data-mode="tunnel">6 · Tunnel</button>
            </div>
            <div class="sep"></div>
            <button class="icon-btn" id="fs-btn" title="Fullscreen (F)">&#x26F6;</button>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-lbl">Theme</span>
            <div class="btn-grp" id="theme-btns">
                <div class="theme-dot on" data-t="0" style="background:linear-gradient(135deg,#00ffff,#ff00ff)" title="Cyber (Q)"></div>
                <div class="theme-dot"    data-t="1" style="background:linear-gradient(135deg,#ff3300,#ffaa00)" title="Fire (W)"></div>
                <div class="theme-dot"    data-t="2" style="background:linear-gradient(135deg,#0055ff,#00ddff)" title="Ocean (E)"></div>
                <div class="theme-dot"    data-t="3" style="background:linear-gradient(135deg,#00ff88,#aa00ff)" title="Aurora (R)"></div>
                <div class="theme-dot"    data-t="4" style="background:linear-gradient(135deg,#ffffff,#666666)" title="Mono (T)"></div>
            </div>
            <div class="sep"></div>
            <span class="ctrl-lbl" style="width:auto">Sensitivity</span>
            <input type="range" id="sens-sl" min="60" max="280" value="130">
            <span class="val-badge" id="sens-val">1.3×</span>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════
    //  Constants & state
    // ═══════════════════════════════════════════
    const THEMES = [
        { c1:'#00ffff', c2:'#ff00ff', c3:'#ffffff', bg:'#080810', rgb1:'0,255,255'   },
        { c1:'#ff3300', c2:'#ffaa00', c3:'#ffffaa', bg:'#0f0400', rgb1:'255,51,0'    },
        { c1:'#0077ff', c2:'#00ddff', c3:'#aaddff', bg:'#000810', rgb1:'0,119,255'   },
        { c1:'#00ff88', c2:'#aa00ff', c3:'#ff88ff', bg:'#040810', rgb1:'0,255,136'   },
        { c1:'#ffffff', c2:'#999999', c3:'#444444', bg:'#080808', rgb1:'255,255,255' },
    ];

    const canvas   = document.getElementById('canvas');
    const ctx      = canvas.getContext('2d');
    const startEl  = document.getElementById('start');
    const hudEl    = document.getElementById('hud');
    const hudStats = document.getElementById('hud-stats');
    const ctrlEl   = document.getElementById('controls');
    const sensSlider = document.getElementById('sens-sl');
    const sensVal    = document.getElementById('sens-val');

    let audioCtx, analyser;
    let running  = false;
    let mode     = 'bars';
    let sensitivity = 1.3;
    let themeIdx = 0;
    let theme    = THEMES[0];
    let particles = [];
    let tunnelZ   = Array.from({length: 20}, (_, i) => (i + 0.5) / 20);
    let frame = 0;

    // Beat detection state
    const BEAT_BUF = 43;
    let beatBuf  = new Float32Array(BEAT_BUF);
    let beatHead = 0;
    let beatCool = false;
    let beatFlash = 0;

    // FPS
    let fpsCount = 0, fpsTs = 0, fps = 60;

    // ═══════════════════════════════════════════
    //  CSS theme sync
    // ═══════════════════════════════════════════
    function applyTheme() {
        const root = document.documentElement.style;
        root.setProperty('--c1',     theme.c1);
        root.setProperty('--c2',     theme.c2);
        root.setProperty('--c1-rgb', theme.rgb1);
    }
    applyTheme();

    // ═══════════════════════════════════════════
    //  Resize
    // ═══════════════════════════════════════════
    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        if (running && mode === 'nebula')  spawnParticles();
        if (running && mode === 'tunnel')  initTunnel();
    }
    resize();
    window.addEventListener('resize', resize);

    // ═══════════════════════════════════════════
    //  Audio — microphone
    // ═══════════════════════════════════════════
    async function initMic() {
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.82;
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx.createMediaStreamSource(stream).connect(analyser);
        go();
    }

    // ═══════════════════════════════════════════
    //  Audio — file
    // ═══════════════════════════════════════════
    async function initFile(file) {
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.82;
        const buf = await audioCtx.decodeAudioData(await file.arrayBuffer());
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.loop   = true;
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        src.start();
        go();
    }

    function go() {
        running = true;
        startEl.style.display = 'none';
        hudEl.classList.add('show');
        ctrlEl.classList.add('show');
        spawnParticles();
        fpsTs = performance.now();
        requestAnimationFrame(tick);
    }

    // ═══════════════════════════════════════════
    //  Beat detection
    // ═══════════════════════════════════════════
    function detectBeat(raw) {
        const end = Math.max(1, Math.floor(raw.length * 0.05));
        let sum = 0;
        for (let i = 0; i < end; i++) sum += raw[i];
        const cur = sum / end;

        beatBuf[beatHead] = cur;
        beatHead = (beatHead + 1) % BEAT_BUF;
        let avg = 0;
        for (let v of beatBuf) avg += v;
        avg /= BEAT_BUF;

        if (cur > avg * 1.38 && cur > 72 && !beatCool) {
            beatCool  = true;
            beatFlash = 1.0;
            setTimeout(() => { beatCool = false; }, 85);
        }
        beatFlash = Math.max(0, beatFlash - 0.052);
        return { cur, avg, flash: beatFlash };
    }

    // ═══════════════════════════════════════════
    //  Particles
    // ═══════════════════════════════════════════
    function spawnParticles() {
        const W = canvas.width, H = canvas.height;
        particles = Array.from({ length: 220 }, () => ({
            x:    Math.random() * W,
            y:    Math.random() * H,
            vx:   (Math.random() - 0.5) * 0.55,
            vy:   (Math.random() - 0.5) * 0.55,
            r:    Math.random() * 2.2 + 0.4,
            freq: Math.floor(Math.random() * 85),
            hue:  Math.random(),
        }));
    }

    function initTunnel() {
        tunnelZ = Array.from({length: 20}, (_, i) => (i + 0.5) / 20);
    }

    // ═══════════════════════════════════════════
    //  Color helpers
    // ═══════════════════════════════════════════
    function h2r(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function lerpC(c1, c2, t) {
        const [r1,g1,b1] = h2r(c1), [r2,g2,b2] = h2r(c2);
        t = Math.max(0, Math.min(1, t));
        return `rgb(${~~(r1+(r2-r1)*t)},${~~(g1+(g2-g1)*t)},${~~(b1+(b2-b1)*t)})`;
    }

    function colorAt(t) {
        return t < 0.5 ? lerpC(theme.c1, theme.c2, t * 2) : lerpC(theme.c2, theme.c3, (t-0.5)*2);
    }

    // ═══════════════════════════════════════════
    //  Draw — Bars
    // ═══════════════════════════════════════════
    function drawBars(data, beat) {
        const W = canvas.width, H = canvas.height;
        const bins = Math.min(data.length, 110);
        const pad  = 1.2;
        const bw   = W / bins;

        ctx.shadowBlur = 10 + beat.flash * 8;

        for (let i = 0; i < bins; i++) {
            const t   = i / bins;
            const v   = (data[i] / 255) * sensitivity;
            const bh  = Math.min(v * H * 0.85, H * 0.92);
            const x   = i * bw;
            const col = colorAt(t);
            ctx.shadowColor = col;
            ctx.fillStyle   = col;
            rr(ctx, x + pad, H - bh, bw - pad * 2, bh, Math.min(bw * 0.22, 3));
            ctx.fill();
        }

        ctx.shadowBlur = 0;

        // Reflection
        ctx.save();
        ctx.globalAlpha = 0.11;
        ctx.scale(1, -1);
        ctx.translate(0, -H * 2);
        for (let i = 0; i < bins; i++) {
            const t   = i / bins;
            const v   = (data[i] / 255) * sensitivity;
            const bh  = Math.min(v * H * 0.85 * 0.22, H);
            const x   = i * bw;
            ctx.fillStyle = colorAt(t);
            ctx.fillRect(x + pad, H - bh, bw - pad * 2, bh);
        }
        ctx.restore();
    }

    // ═══════════════════════════════════════════
    //  Draw — Wave
    // ═══════════════════════════════════════════
    function drawWave(data, beat) {
        const W = canvas.width, H = canvas.height;
        const td  = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(td);
        const sl = W / td.length;

        function wavePath(scl, dy) {
            ctx.beginPath();
            for (let i = 0; i < td.length; i++) {
                const dev = ((td[i] / 128.0) - 1) * sensitivity * scl;
                const y   = H / 2 + dev * H * 0.42 + dy;
                i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * sl, y);
            }
        }

        // Primary
        ctx.lineWidth   = 2.4;
        ctx.strokeStyle = theme.c1;
        ctx.shadowColor = theme.c1;
        ctx.shadowBlur  = 16 + beat.flash * 14;
        wavePath(1, 0);
        ctx.stroke();

        // Secondary
        ctx.globalAlpha = 0.38;
        ctx.lineWidth   = 1.4;
        ctx.strokeStyle = theme.c2;
        ctx.shadowColor = theme.c2;
        ctx.shadowBlur  = 8;
        wavePath(0.55, 22);
        ctx.stroke();

        // Center hairline
        ctx.globalAlpha = 0.07;
        ctx.lineWidth   = 1;
        ctx.strokeStyle = '#fff';
        ctx.shadowBlur  = 0;
        ctx.beginPath();
        ctx.moveTo(0, H / 2);
        ctx.lineTo(W, H / 2);
        ctx.stroke();

        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Draw — Radial
    // ═══════════════════════════════════════════
    function drawRadial(data, beat) {
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2;
        const bins   = Math.min(data.length, 180);
        const minR   = Math.min(W, H) * (0.155 + beat.flash * 0.022);
        const maxR   = Math.min(W, H) * 0.44;
        const lw     = Math.max((Math.PI * 2 * minR) / bins * 0.72, 0.5);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(frame * 0.0014);

        ctx.lineWidth  = lw;
        ctx.shadowBlur = 9 + beat.flash * 7;

        for (let i = 0; i < bins; i++) {
            const angle = (i / bins) * Math.PI * 2;
            const v     = (data[i] / 255) * sensitivity;
            const r     = minR + v * (maxR - minR);
            const col   = colorAt(i / bins);
            ctx.strokeStyle = col;
            ctx.shadowColor = col;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * minR, Math.sin(angle) * minR);
            ctx.lineTo(Math.cos(angle) * r,    Math.sin(angle) * r);
            ctx.stroke();
        }

        // Inner glow ring
        ctx.shadowBlur   = 22 + beat.flash * 35;
        ctx.shadowColor  = theme.c1;
        ctx.strokeStyle  = theme.c1;
        ctx.lineWidth    = 1.5;
        ctx.globalAlpha  = 0.65 + beat.flash * 0.35;
        ctx.beginPath();
        ctx.arc(0, 0, minR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Draw — Nebula (particles)
    // ═══════════════════════════════════════════
    function drawNebula(data, beat) {
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2;
        const burstMul = 1 + beat.flash * 5;

        ctx.shadowBlur = 0;

        for (const p of particles) {
            const energy = (data[p.freq] / 255) * sensitivity;

            p.vx += (Math.random() - 0.5) * energy * 0.75 * burstMul;
            p.vy += (Math.random() - 0.5) * energy * 0.75 * burstMul;

            // Weak central attractor
            const dx = cx - p.x, dy = cy - p.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 80) { p.vx += (dx / dist) * 0.045; p.vy += (dy / dist) * 0.045; }

            p.vx *= 0.962;
            p.vy *= 0.962;
            p.x  += p.vx;
            p.y  += p.vy;

            if (p.x < -60) p.x = W + 60;
            if (p.x > W + 60) p.x = -60;
            if (p.y < -60) p.y = H + 60;
            if (p.y > H + 60) p.y = -60;

            const t   = (p.hue + energy * 0.28) % 1;
            const col = colorAt(t);
            const sz  = p.r * (1 + energy * 2.8);

            ctx.beginPath();
            ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
            ctx.fillStyle   = col;
            ctx.shadowColor = col;
            ctx.shadowBlur  = sz * 5;
            ctx.globalAlpha = Math.min(1, 0.32 + energy * 0.68);
            ctx.fill();
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Draw — Fractal Tree
    // ═══════════════════════════════════════════
    function drawFractal(data, beat) {
        const W = canvas.width, H = canvas.height;

        function band(lo, hi) {
            let s = 0;
            for (let i = lo; i < hi; i++) s += data[i];
            return Math.min(1, (s / ((hi - lo) * 255)) * sensitivity);
        }

        const bass = band(0, 8);
        const mid  = band(8, 40);
        const high = band(40, 100);

        const maxD   = 8 + Math.floor(high * 2);       // 8-10 levels
        const spread = 0.28 + mid * 0.58;               // branch angle
        const ratio  = 0.58 + high * 0.14;              // branch length ratio
        const trunk  = H * 0.26 * (0.82 + bass * 0.35);
        const sway   = Math.sin(frame * 0.008) * 0.04 * (1 + mid * 0.5);

        // Use a single shadowBlur for performance
        ctx.shadowColor = theme.c2;
        ctx.shadowBlur  = 12;

        function br(x1, y1, ang, len, d) {
            if (d < 0 || len < 1.2) return;
            const x2 = x1 + Math.cos(ang) * len;
            const y2 = y1 + Math.sin(ang) * len;
            const t  = (maxD - d) / maxD;

            ctx.lineWidth   = Math.max(0.4, (d / maxD) * 4.5 * (1 + bass * 0.25));
            ctx.strokeStyle = colorAt(t);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            br(x2, y2, ang - spread, len * ratio, d - 1);
            br(x2, y2, ang + spread, len * ratio, d - 1);
        }

        // Canopy (upward tree)
        br(W / 2, H + 5, -Math.PI / 2 + sway, trunk, maxD);

        // Roots (mirrored downward, dimmed)
        ctx.globalAlpha = 0.22;
        ctx.shadowBlur  = 5;
        br(W / 2, -5, Math.PI / 2 - sway, trunk * 0.48, maxD - 2);
        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;

        // Beat root burst
        if (beat.flash > 0.05) {
            const g = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, trunk * 2.2);
            g.addColorStop(0, theme.c1 + Math.floor(beat.flash * 0x44).toString(16).padStart(2, '0'));
            g.addColorStop(1, 'transparent');
            ctx.fillStyle   = g;
            ctx.globalAlpha = beat.flash * 0.38;
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 1;
        }
    }

    // ═══════════════════════════════════════════
    //  Draw — Depth Tunnel
    // ═══════════════════════════════════════════
    function drawTunnel(data, beat) {
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2;
        const SIDES = 6;
        const speed = 0.0026 + beat.flash * 0.022;

        // Advance each ring toward viewer, wrap when past
        for (let i = 0; i < tunnelZ.length; i++) {
            tunnelZ[i] -= speed;
            if (tunnelZ[i] < 0) tunnelZ[i] = 1;
        }

        // Painter's order: far (high z) first
        const sorted = tunnelZ.map((z, i) => ({z, i})).sort((a, b) => b.z - a.z);

        // Vanishing point glow
        const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 70);
        vg.addColorStop(0, theme.c1 + '20');
        vg.addColorStop(1, 'transparent');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);

        // Perspective lines from center (faint depth cues)
        ctx.globalAlpha = 0.04;
        ctx.strokeStyle = theme.c1;
        ctx.lineWidth   = 0.5;
        for (let j = 0; j < SIDES; j++) {
            const ang = (j / SIDES) * Math.PI * 2 + frame * 0.005;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(ang) * Math.max(W, H), cy + Math.sin(ang) * Math.max(W, H) * 0.9);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(cx, cy);

        for (const {z, i} of sorted) {
            const near = 1 - z;                         // 0=far, 1=near
            const sz   = near * Math.min(W, H) * 0.58;
            if (sz < 2) continue;

            const binIdx = Math.min(Math.floor(z * 80), data.length - 1);
            const energy = (data[binIdx] / 255) * sensitivity;

            const col = colorAt((i / tunnelZ.length + frame * 0.002) % 1);

            ctx.strokeStyle = col;
            ctx.lineWidth   = 0.6 + near * 2.8 + energy * 2.2;
            ctx.shadowColor = col;
            ctx.shadowBlur  = 4 + near * 16 + energy * 18;
            ctx.globalAlpha = near * near * (0.36 + energy * 0.64);

            ctx.beginPath();
            for (let j = 0; j <= SIDES; j++) {
                const ang  = (j / SIDES) * Math.PI * 2 + frame * 0.005;
                const warp = 1 + energy * 0.32 * Math.sin(j * 2.5 + frame * 0.06);
                const r    = sz / 2 * warp;
                j === 0
                    ? ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r * 0.9)
                    : ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r * 0.9);
            }
            ctx.closePath();
            ctx.stroke();
        }

        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Rounded rect helper
    // ═══════════════════════════════════════════
    function rr(c, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y,     x + w, y + h, r);
        c.arcTo(x + w, y + h, x,     y + h, r);
        c.arcTo(x,     y + h, x,     y,     r);
        c.arcTo(x,     y,     x + w, y,     r);
        c.closePath();
    }

    // ═══════════════════════════════════════════
    //  Main animation loop
    // ═══════════════════════════════════════════
    function tick(ts) {
        if (!running) return;
        requestAnimationFrame(tick);
        frame++;

        // FPS
        fpsCount++;
        if (ts - fpsTs >= 1000) {
            fps      = fpsCount;
            fpsCount = 0;
            fpsTs    = ts;
        }

        const W = canvas.width, H = canvas.height;
        const bufLen = analyser.frequencyBinCount;
        const raw    = new Uint8Array(bufLen);
        analyser.getByteFrequencyData(raw);

        const beat = detectBeat(raw);

        // Scale data for drawing
        const data = new Uint8Array(bufLen);
        for (let i = 0; i < bufLen; i++) data[i] = Math.min(255, raw[i] * sensitivity);

        // Background — nebula trails; tunnel uses hard clear (rings draw their own depth)
        if (mode === 'nebula') {
            ctx.fillStyle   = theme.bg;
            ctx.globalAlpha = 0.14;
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 1;
        } else {
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, W, H);
        }

        // Beat flash overlay
        if (beat.flash > 0.01) {
            const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.62);
            g.addColorStop(0, theme.c1 + '22');
            g.addColorStop(1, 'transparent');
            ctx.fillStyle   = g;
            ctx.globalAlpha = beat.flash * 0.55;
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 1;
        }

        // Draw active mode
        switch (mode) {
            case 'bars':    drawBars(data, beat);    break;
            case 'wave':    drawWave(data, beat);    break;
            case 'radial':  drawRadial(data, beat);  break;
            case 'nebula':  drawNebula(data, beat);  break;
            case 'fractal': drawFractal(data, beat); break;
            case 'tunnel':  drawTunnel(data, beat);  break;
        }

        // HUD update
        let avg = 0;
        for (let v of raw) avg += v;
        avg = Math.round(avg / raw.length);
        hudStats.textContent =
            `Level: ${avg} · Bass: ${Math.round(beat.cur)} · ${fps} fps`;
    }

    // ═══════════════════════════════════════════
    //  Start-screen particle background
    // ═══════════════════════════════════════════
    (function startBg() {
        const sc   = document.getElementById('start-canvas');
        const sctx = sc.getContext('2d');
        let pts = [];
        let t = 0;

        function resizeSc() { sc.width = window.innerWidth; sc.height = window.innerHeight; }
        resizeSc();
        window.addEventListener('resize', resizeSc);

        for (let i = 0; i < 55; i++) {
            pts.push({
                x:   Math.random() * sc.width,
                y:   Math.random() * sc.height,
                vx:  (Math.random() - 0.5) * 0.38,
                vy:  (Math.random() - 0.5) * 0.38,
                r:   Math.random() * 2 + 0.4,
                hue: Math.random(),
            });
        }

        function drawStart() {
            if (startEl.style.display === 'none') return;
            requestAnimationFrame(drawStart);
            t += 0.007;
            sctx.clearRect(0, 0, sc.width, sc.height);

            for (const p of pts) {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > sc.width)  p.vx *= -1;
                if (p.y < 0 || p.y > sc.height)  p.vy *= -1;

                const a   = 0.18 + Math.sin(t + p.hue * 6) * 0.08;
                const col = p.hue < 0.5 ? `rgba(0,255,255,${a})` : `rgba(255,0,255,${a})`;

                sctx.beginPath();
                sctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                sctx.fillStyle   = col;
                sctx.shadowColor = col;
                sctx.shadowBlur  = 7;
                sctx.fill();
            }

            sctx.shadowBlur = 0;
            for (let i = 0; i < pts.length; i++) {
                for (let j = i + 1; j < pts.length; j++) {
                    const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
                    if (d < 115) {
                        sctx.beginPath();
                        sctx.moveTo(pts[i].x, pts[i].y);
                        sctx.lineTo(pts[j].x, pts[j].y);
                        sctx.strokeStyle = `rgba(0,255,255,${(1 - d / 115) * 0.1})`;
                        sctx.lineWidth   = 0.5;
                        sctx.stroke();
                    }
                }
            }
        }
        drawStart();
    })();

    // ═══════════════════════════════════════════
    //  UI — mode buttons
    // ═══════════════════════════════════════════
    function setMode(m) {
        mode = m;
        if (mode === 'nebula')  spawnParticles();
        if (mode === 'tunnel')  initTunnel();
        document.querySelectorAll('[data-mode]').forEach(b => {
            b.classList.toggle('on', b.dataset.mode === m);
        });
    }

    document.querySelectorAll('[data-mode]').forEach(b =>
        b.addEventListener('click', () => setMode(b.dataset.mode)));

    // ═══════════════════════════════════════════
    //  UI — theme dots
    // ═══════════════════════════════════════════
    function setTheme(i) {
        themeIdx = i;
        theme    = THEMES[i];
        applyTheme();
        document.querySelectorAll('[data-t]').forEach((b, idx) =>
            b.classList.toggle('on', idx === i));
    }

    document.querySelectorAll('[data-t]').forEach((b, i) =>
        b.addEventListener('click', () => setTheme(i)));

    // ═══════════════════════════════════════════
    //  UI — sensitivity slider
    // ═══════════════════════════════════════════
    sensSlider.addEventListener('input', () => {
        sensitivity = sensSlider.value / 100;
        sensVal.textContent = sensitivity.toFixed(1) + '×';
    });

    // ═══════════════════════════════════════════
    //  UI — fullscreen
    // ═══════════════════════════════════════════
    document.getElementById('fs-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen();
        }
    });

    // ═══════════════════════════════════════════
    //  UI — audio init buttons
    // ═══════════════════════════════════════════
    document.getElementById('mic-btn').addEventListener('click', async () => {
        try {
            await initMic();
        } catch (e) {
            alert(
                'Microphone access denied or unavailable.\n\n' +
                'Make sure this page is served from localhost (run: npm run viz)\n' +
                'and that browser microphone permission is granted.'
            );
        }
    });

    document.getElementById('file-input').addEventListener('change', async e => {
        if (!e.target.files[0]) return;
        try {
            await initFile(e.target.files[0]);
        } catch {
            alert('Could not decode this audio file. Try MP3, WAV, or OGG.');
        }
    });

    // ═══════════════════════════════════════════
    //  Keyboard shortcuts
    // ═══════════════════════════════════════════
    document.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if      (k === '1') setMode('bars');
        else if (k === '2') setMode('wave');
        else if (k === '3') setMode('radial');
        else if (k === '4') setMode('nebula');
        else if (k === '5') setMode('fractal');
        else if (k === '6') setMode('tunnel');
        else if (k === 'q') setTheme(0);
        else if (k === 'w') setTheme(1);
        else if (k === 'e') setTheme(2);
        else if (k === 'r') setTheme(3);
        else if (k === 't') setTheme(4);
        else if (k === 'f') document.getElementById('fs-btn').click();
        else if (k === '+' || k === '=') {
            sensSlider.value = Math.min(+sensSlider.value + 10, sensSlider.max);
            sensSlider.dispatchEvent(new Event('input'));
        } else if (k === '-') {
            sensSlider.value = Math.max(+sensSlider.value - 10, sensSlider.min);
            sensSlider.dispatchEvent(new Event('input'));
        }
    });

    // ═══════════════════════════════════════════
    //  Auto-hide controls on mouse idle
    // ═══════════════════════════════════════════
    let idleTimer;
    function wake() {
        document.body.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add('idle'), 3200);
    }
    ['mousemove', 'click', 'keydown', 'touchstart'].forEach(ev =>
        document.addEventListener(ev, wake));
    wake();
    </script>
</body>
</html>
