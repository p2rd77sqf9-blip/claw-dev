<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Reactive Visualizer</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --c1: #00ffff;
            --c2: #ff00ff;
            --c1-rgb: 0,255,255;
            /* Liquid Glass tokens */
            --glass-bg:      rgba(255, 255, 255, 0.055);
            --glass-border:  rgba(255, 255, 255, 0.14);
            --glass-shine:   rgba(255, 255, 255, 0.18);
            --glass-shadow:  rgba(0, 0, 0, 0.45);
            --glass-blur:    blur(28px) saturate(160%);
            --glass-radius:  20px;
        }

        body {
            background: #080810;
            color: #fff;
            font-family: -apple-system, 'Segoe UI', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas, #gl-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #canvas    { display: block; }
        #gl-canvas { display: none; }

        /* ── Liquid Glass base ── */
        .glass {
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 12px 48px var(--glass-shadow),
                inset 0 1px 0 var(--glass-shine),
                inset 0 -1px 0 rgba(0, 0, 0, 0.14);
            position: relative;
            overflow: hidden;
        }

        /* Top specular edge highlight */
        .glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12px;
            right: 12px;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255,255,255,0.4) 30%,
                rgba(255,255,255,0.55) 50%,
                rgba(255,255,255,0.4) 70%,
                transparent 100%);
            border-radius: 100px;
            pointer-events: none;
        }

        /* Inner top sheen (refraction gradient) */
        .glass::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.06) 0%,
                transparent 100%);
            border-radius: inherit;
            pointer-events: none;
        }

        /* ── Start Screen ── */
        #start {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 55%, #0d0d22 0%, #080810 68%);
        }

        #start-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .start-inner {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 52px 64px 44px;
            border-radius: 32px;
            /* Liquid Glass — slightly darker tint so content reads clearly */
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            background: linear-gradient(
                160deg,
                rgba(var(--c1-rgb), 0.06) 0%,
                rgba(255, 255, 255, 0.04) 40%,
                rgba(255, 255, 255, 0.03) 100%
            );
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        /* Specular edge on the start card */
        .start-inner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 16px;
            right: 16px;
            height: 1px;
            background: linear-gradient(90deg,
                transparent,
                rgba(255,255,255,0.5) 35%,
                rgba(255,255,255,0.65) 50%,
                rgba(255,255,255,0.5) 65%,
                transparent);
            pointer-events: none;
        }

        /* Top inner sheen */
        .start-inner::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 42%;
            background: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, transparent 100%);
            border-radius: 32px 32px 0 0;
            pointer-events: none;
        }

        .start-title {
            position: relative;
            z-index: 1;
            font-size: clamp(2.8rem, 7vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.05;
            margin-bottom: 10px;
        }

        .start-sub {
            position: relative;
            z-index: 1;
            color: rgba(255,255,255,0.42);
            font-size: 0.95rem;
            margin-bottom: 44px;
            letter-spacing: 0.02em;
        }

        .start-actions {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Liquid Glass primary button */
        .btn-primary {
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            background: linear-gradient(
                135deg,
                rgba(var(--c1-rgb), 0.18) 0%,
                rgba(255, 255, 255, 0.06) 100%
            );
            border: 1px solid rgba(var(--c1-rgb), 0.38);
            color: #fff;
            padding: 13px 34px;
            border-radius: 100px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.24s ease;
            letter-spacing: 0.04em;
            box-shadow:
                0 4px 24px rgba(var(--c1-rgb), 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            border-radius: 100px 100px 0 0;
            pointer-events: none;
        }

        .btn-primary:hover {
            background: linear-gradient(
                135deg,
                rgba(var(--c1-rgb), 0.28) 0%,
                rgba(255, 255, 255, 0.1) 100%
            );
            border-color: rgba(var(--c1-rgb), 0.7);
            transform: translateY(-2px);
            box-shadow:
                0 10px 36px rgba(var(--c1-rgb), 0.24),
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
        }

        /* Secondary Liquid Glass button — no color tint */
        .btn-glass {
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.72);
            padding: 13px 34px;
            border-radius: 100px;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.24s ease;
            letter-spacing: 0.04em;
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                inset 0 -1px 0 rgba(0, 0, 0, 0.08);
        }

        .btn-glass::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.09) 0%, transparent 100%);
            border-radius: 100px 100px 0 0;
            pointer-events: none;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: translateY(-2px);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                inset 0 -1px 0 rgba(0, 0, 0, 0.08);
        }

        .btn-file {
            position: relative;
            z-index: 1;
            color: rgba(255,255,255,0.36);
            font-size: 0.83rem;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s;
        }

        .btn-file:hover { color: rgba(255,255,255,0.65); }

        .start-hint {
            position: relative;
            z-index: 1;
            margin-top: 36px;
            color: rgba(255,255,255,0.16);
            font-size: 0.72rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        /* ── HUD — Liquid Glass pill badge ── */
        #hud {
            position: fixed;
            top: 18px;
            left: 20px;
            z-index: 50;
            padding: 10px 16px;
            border-radius: 16px;
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 6px 28px rgba(0, 0, 0, 0.38),
                inset 0 1px 0 var(--glass-shine),
                inset 0 -1px 0 rgba(0, 0, 0, 0.12);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
            overflow: hidden;
        }

        /* HUD top specular */
        #hud::before {
            content: '';
            position: absolute;
            top: 0; left: 8px; right: 8px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            pointer-events: none;
        }

        #hud.show { opacity: 1; }
        body.idle #hud { opacity: 0; }

        .hud-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hud-stats {
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            margin-top: 3px;
            letter-spacing: 0.04em;
        }

        /* ── Controls — floating Liquid Glass card ── */
        #controls {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            padding: 14px 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
            width: max-content;
            max-width: calc(100vw - 32px);
            border-radius: var(--glass-radius);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 16px 56px var(--glass-shadow),
                inset 0 1px 0 var(--glass-shine),
                inset 0 -1px 0 rgba(0, 0, 0, 0.14);
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            overflow: hidden;
        }

        /* Controls top specular line */
        #controls::before {
            content: '';
            position: absolute;
            top: 0; left: 16px; right: 16px;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(255,255,255,0.38) 25%,
                rgba(255,255,255,0.55) 50%,
                rgba(255,255,255,0.38) 75%,
                transparent 100%);
            pointer-events: none;
        }

        /* Controls top inner sheen */
        #controls::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.045) 0%, transparent 100%);
            border-radius: var(--glass-radius) var(--glass-radius) 0 0;
            pointer-events: none;
        }

        #controls.show { display: flex; opacity: 1; }
        body.idle #controls {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(6px);
        }

        .ctrl-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ctrl-lbl {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            width: 56px;
            flex-shrink: 0;
        }

        .btn-grp { display: flex; gap: 4px; flex-wrap: wrap; }

        /* Liquid Glass pill button */
        .btn {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.11);
            color: rgba(255, 255, 255, 0.5);
            padding: 5px 13px;
            border-radius: 100px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.18s ease;
            letter-spacing: 0.03em;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Button inner sheen */
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 100%);
            border-radius: 100px 100px 0 0;
            pointer-events: none;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.18),
                0 2px 12px rgba(0,0,0,0.2);
        }

        .btn.on {
            background: linear-gradient(
                145deg,
                rgba(var(--c1-rgb), 0.22) 0%,
                rgba(var(--c1-rgb), 0.1) 100%
            );
            border-color: rgba(var(--c1-rgb), 0.5);
            color: var(--c1);
            box-shadow:
                inset 0 1px 0 rgba(var(--c1-rgb), 0.3),
                0 0 14px rgba(var(--c1-rgb), 0.15);
            text-shadow: 0 0 12px rgba(var(--c1-rgb), 0.6);
        }

        /* Theme dot swatches */
        .theme-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .theme-dot:hover {
            transform: scale(1.18);
            border-color: rgba(255,255,255,0.4);
        }

        .theme-dot.on {
            border-color: rgba(255,255,255,0.85);
            transform: scale(1.28);
            box-shadow:
                0 0 0 2px rgba(255,255,255,0.12),
                0 4px 14px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.35);
        }

        /* Glass range slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 86px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 100px;
            outline: none;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.7), var(--c1) 60%);
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 2px 8px rgba(var(--c1-rgb), 0.4), 0 0 0 1px rgba(var(--c1-rgb), 0.2);
        }

        /* Divider */
        .sep {
            width: 1px;
            height: 16px;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.12), transparent);
            margin: 0 2px;
            flex-shrink: 0;
        }

        /* Icon button — glass square */
        .icon-btn {
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.11);
            color: rgba(255,255,255,0.45);
            width: 28px;
            height: 28px;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s ease;
            font-size: 13px;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .icon-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
            border-radius: 9px 9px 0 0;
            pointer-events: none;
        }

        .icon-btn:hover {
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.2);
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 2px 10px rgba(0,0,0,0.2);
        }

        .val-badge {
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            min-width: 28px;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <canvas id="gl-canvas"></canvas>

    <!-- Start screen -->
    <div id="start">
        <canvas id="start-canvas"></canvas>
        <div class="start-inner">
            <div class="start-title">Visualizer</div>
            <div class="start-sub">Real-time audio frequency analysis</div>
            <div class="start-actions">
                <button class="btn-primary" id="mic-btn">Use Microphone</button>
                <button class="btn-glass"   id="sys-btn">Computer Audio</button>
            </div>
            <label class="btn-file" style="position:relative;z-index:1;margin-top:14px;">
                or upload audio file
                <input type="file" id="file-input" accept="audio/*" style="display:none">
            </label>
            <div class="start-hint">1-7 = modes &nbsp;·&nbsp; Q-T = themes &nbsp;·&nbsp; +/− = sensitivity &nbsp;·&nbsp; F = fullscreen</div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-title">Visualizer</div>
        <div class="hud-stats" id="hud-stats">Level: — &nbsp;·&nbsp; Bass: —</div>
    </div>

    <!-- Controls -->
    <div id="controls">
        <div class="ctrl-row">
            <span class="ctrl-lbl">Mode</span>
            <div class="btn-grp" id="mode-btns">
                <button class="btn on" data-mode="bars">1 · Bars</button>
                <button class="btn" data-mode="wave">2 · Wave</button>
                <button class="btn" data-mode="radial">3 · Radial</button>
                <button class="btn" data-mode="nebula">4 · Nebula</button>
                <button class="btn" data-mode="fractal">5 · Fractal</button>
                <button class="btn" data-mode="tunnel">6 · Tunnel</button>
                <button class="btn" data-mode="sphere">7 · Sphere</button>
            </div>
            <div class="sep"></div>
            <button class="icon-btn" id="fs-btn" title="Fullscreen (F)">&#x26F6;</button>
        </div>
        <div class="ctrl-row">
            <span class="ctrl-lbl">Theme</span>
            <div class="btn-grp" id="theme-btns">
                <div class="theme-dot on" data-t="0" style="background:linear-gradient(135deg,#00ffff,#ff00ff)" title="Cyber (Q)"></div>
                <div class="theme-dot"    data-t="1" style="background:linear-gradient(135deg,#ff3300,#ffaa00)" title="Fire (W)"></div>
                <div class="theme-dot"    data-t="2" style="background:linear-gradient(135deg,#0055ff,#00ddff)" title="Ocean (E)"></div>
                <div class="theme-dot"    data-t="3" style="background:linear-gradient(135deg,#00ff88,#aa00ff)" title="Aurora (R)"></div>
                <div class="theme-dot"    data-t="4" style="background:linear-gradient(135deg,#ffffff,#666666)" title="Mono (T)"></div>
            </div>
            <div class="sep"></div>
            <span class="ctrl-lbl" style="width:auto">Sensitivity</span>
            <input type="range" id="sens-sl" min="60" max="280" value="130">
            <span class="val-badge" id="sens-val">1.3×</span>
        </div>
    </div>

    <script>
    // ═══════════════════════════════════════════
    //  Constants & state
    // ═══════════════════════════════════════════
    const THEMES = [
        { c1:'#00ffff', c2:'#ff00ff', c3:'#ffffff', bg:'#080810', rgb1:'0,255,255'   },
        { c1:'#ff3300', c2:'#ffaa00', c3:'#ffffaa', bg:'#0f0400', rgb1:'255,51,0'    },
        { c1:'#0077ff', c2:'#00ddff', c3:'#aaddff', bg:'#000810', rgb1:'0,119,255'   },
        { c1:'#00ff88', c2:'#aa00ff', c3:'#ff88ff', bg:'#040810', rgb1:'0,255,136'   },
        { c1:'#ffffff', c2:'#999999', c3:'#444444', bg:'#080808', rgb1:'255,255,255' },
    ];

    const canvas   = document.getElementById('canvas');
    const ctx      = canvas.getContext('2d');
    const startEl  = document.getElementById('start');
    const hudEl    = document.getElementById('hud');
    const hudStats = document.getElementById('hud-stats');
    const ctrlEl   = document.getElementById('controls');
    const sensSlider = document.getElementById('sens-sl');
    const sensVal    = document.getElementById('sens-val');

    let audioCtx, analyser;
    let running  = false;
    let mode     = 'bars';
    let sensitivity = 1.3;
    let themeIdx = 0;
    let theme    = THEMES[0];
    let particles = [];
    let tunnelZ   = Array.from({length: 20}, (_, i) => (i + 0.5) / 20);
    let frame = 0;

    // Beat detection state
    const BEAT_BUF = 43;
    let beatBuf  = new Float32Array(BEAT_BUF);
    let beatHead = 0;
    let beatCool = false;
    let beatFlash = 0;

    // FPS
    let fpsCount = 0, fpsTs = 0, fps = 60;

    // ═══════════════════════════════════════════
    //  CSS theme sync
    // ═══════════════════════════════════════════
    function applyTheme() {
        const root = document.documentElement.style;
        root.setProperty('--c1',     theme.c1);
        root.setProperty('--c2',     theme.c2);
        root.setProperty('--c1-rgb', theme.rgb1);
    }
    applyTheme();

    // ═══════════════════════════════════════════
    //  Resize
    // ═══════════════════════════════════════════
    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        if (running && mode === 'nebula')  spawnParticles();
        if (running && mode === 'tunnel' && !glReady) initTunnel();
        resizeGL();
    }

    // ═══════════════════════════════════════════
    //  WebGL — raymarched fractal renderer
    //  (Fractal + Tunnel modes; falls back to the
    //   canvas2d versions below if WebGL is unavailable)
    // ═══════════════════════════════════════════
    const glCanvas = document.getElementById('gl-canvas');
    let gl = null, glProg = null, glU = {}, glReady = false, glStartTs = 0;

    const GL_VERT_SRC = `
        attribute vec2 aPos;
        void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
    `;

    const GL_FRAG_SRC = `
        precision highp float;
        uniform vec2  uRes;
        uniform float uTime;
        uniform float uBass, uMid, uHigh, uBeat;
        uniform vec3  uC1, uC2, uC3, uBg;
        uniform int   uScene;

        mat2 rot2(float a){ float s = sin(a), c = cos(a); return mat2(c, -s, s, c); }

        vec3 palette(float t){
            t = fract(t);
            return t < 0.5 ? mix(uC1, uC2, t * 2.0) : mix(uC2, uC3, (t - 0.5) * 2.0);
        }

        // Sierpinski-tetrahedron IFS fold — classic, well-behaved distance estimator
        float deKIFS(vec3 p, float scale, int iters){
            vec3 a1 = vec3( 1.0,  1.0,  1.0);
            vec3 a2 = vec3(-1.0, -1.0,  1.0);
            vec3 a3 = vec3( 1.0, -1.0, -1.0);
            vec3 a4 = vec3(-1.0,  1.0, -1.0);
            float n = 0.0;
            for (int i = 0; i < 9; i++){
                if (i >= iters) break;
                vec3 c = a1; float dist = length(p - a1);
                float d = length(p - a2); if (d < dist) { c = a2; dist = d; }
                d = length(p - a3); if (d < dist) { c = a3; dist = d; }
                d = length(p - a4); if (d < dist) { c = a4; dist = d; }
                p = scale * p - c * (scale - 1.0);
                n += 1.0;
            }
            return length(p) * pow(scale, -n);
        }

        float map(vec3 p){
            if (uScene == 1) {
                // Infinite fractal tunnel: repeat space along z, twist with highs
                float period = 5.5 - uMid * 1.2;
                p.xy = rot2(p.z * 0.18 + uHigh * 1.8) * p.xy;
                p.z  = mod(p.z, period) - period * 0.5;
                float scale = 2.0 + uHigh * 0.32;
                return deKIFS(p, scale, 7) * 0.85;
            } else {
                // Centered fractal object, slow auto-rotation, bass-driven fold scale
                p.xz = rot2(uTime * 0.12) * p.xz;
                p.xy = rot2(uTime * 0.08 + uBass * 0.6) * p.xy;
                float scale = 1.82 + uMid * 0.5;
                return deKIFS(p, scale, 8) * 0.85;
            }
        }

        void main(){
            vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

            vec3 ro, rd;
            if (uScene == 1) {
                float t = uTime * (0.6 + uBass * 0.8 + uBeat * 0.5);
                ro = vec3(0.0, 0.0, t);
                rd = normalize(vec3(uv, 0.85));
            } else {
                float dist = 4.2 - uBass * 0.8 - uBeat * 0.4;
                float ang  = uTime * 0.05;
                ro = vec3(sin(ang) * dist, 0.0, cos(ang) * dist);
                vec3 fwd   = normalize(-ro);
                vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
                vec3 up    = cross(right, fwd);
                rd = normalize(fwd * 1.4 + right * uv.x + up * uv.y);
            }

            float dO = 0.0;
            float glow = 0.0;
            int steps = 0;
            const int MAX_STEPS = 70;
            for (int i = 0; i < MAX_STEPS; i++){
                vec3 p  = ro + rd * dO;
                float dS = map(p);
                glow += exp(-dS * 14.0) * 0.045;
                dO += max(dS * 0.55, 0.0018);
                steps = i;
                if (dS < 0.001 || dO > 22.0) break;
            }

            vec3 col = uBg * 0.5;
            if (dO < 22.0) {
                float tt = float(steps) / float(MAX_STEPS);
                float trapMix = tt * 1.4 + uTime * 0.04 + (uScene == 1 ? dO * 0.03 : 0.0);
                col = palette(trapMix);
                float fog = clamp(1.0 - dO / 22.0, 0.0, 1.0);
                col *= fog;
            }
            col += palette(glow * 0.3 + uTime * 0.05) * glow * (0.5 + uBeat * 1.2);
            col += uBg * 0.12;

            gl_FragColor = vec4(col, 1.0);
        }
    `;

    function compileGLShader(src, type){
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
            console.error(gl.getShaderInfoLog(sh));
            gl.deleteShader(sh);
            return null;
        }
        return sh;
    }

    function initGL(){
        try {
            gl = glCanvas.getContext('webgl', { antialias: false, alpha: false })
              || glCanvas.getContext('experimental-webgl', { antialias: false, alpha: false });
            if (!gl) return false;

            const vs = compileGLShader(GL_VERT_SRC, gl.VERTEX_SHADER);
            const fs = compileGLShader(GL_FRAG_SRC, gl.FRAGMENT_SHADER);
            if (!vs || !fs) return false;

            glProg = gl.createProgram();
            gl.attachShader(glProg, vs);
            gl.attachShader(glProg, fs);
            gl.linkProgram(glProg);
            if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) {
                console.error(gl.getProgramInfoLog(glProg));
                return false;
            }

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(glProg, 'aPos');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

            ['uRes','uTime','uBass','uMid','uHigh','uBeat','uC1','uC2','uC3','uBg','uScene'].forEach(n => {
                glU[n] = gl.getUniformLocation(glProg, n);
            });

            glStartTs = performance.now();
            return true;
        } catch (e) {
            console.error('WebGL init failed', e);
            return false;
        }
    }

    function resizeGL(){
        if (!gl) return;
        const scale = Math.min(window.devicePixelRatio || 1, 1.2);
        glCanvas.width  = Math.max(1, Math.round(window.innerWidth  * scale * 0.72));
        glCanvas.height = Math.max(1, Math.round(window.innerHeight * scale * 0.72));
        gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    }

    function h2v3(hex){
        const [r, g, b] = h2r(hex);
        return [r / 255, g / 255, b / 255];
    }

    function renderGL(sceneIdx, bass, mid, high, beatFlash){
        if (!glReady) return;
        gl.useProgram(glProg);
        gl.uniform2f(glU.uRes, glCanvas.width, glCanvas.height);
        gl.uniform1f(glU.uTime, (performance.now() - glStartTs) / 1000);
        gl.uniform1f(glU.uBass, bass);
        gl.uniform1f(glU.uMid,  mid);
        gl.uniform1f(glU.uHigh, high);
        gl.uniform1f(glU.uBeat, beatFlash);
        gl.uniform3fv(glU.uC1, h2v3(theme.c1));
        gl.uniform3fv(glU.uC2, h2v3(theme.c2));
        gl.uniform3fv(glU.uC3, h2v3(theme.c3));
        gl.uniform3fv(glU.uBg, h2v3(theme.bg));
        gl.uniform1i(glU.uScene, sceneIdx);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    function bandEnergy(arr, lo, hi){
        let s = 0;
        for (let i = lo; i < hi; i++) s += arr[i];
        return Math.min(1, s / ((hi - lo) * 255));
    }

    function useGLMode(){
        return glReady && (mode === 'fractal' || mode === 'tunnel');
    }

    function updateCanvasVisibility(){
        const gl_on = useGLMode();
        glCanvas.style.display = gl_on ? 'block' : 'none';
        canvas.style.display   = gl_on ? 'none'  : 'block';
    }

    resize();
    window.addEventListener('resize', resize);

    glReady = initGL();
    if (glReady) resizeGL();
    updateCanvasVisibility();

    // ═══════════════════════════════════════════
    //  Audio — microphone
    // ═══════════════════════════════════════════
    async function initMic() {
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.82;
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx.createMediaStreamSource(stream).connect(analyser);
        go();
    }

    // ═══════════════════════════════════════════
    //  Audio — file
    // ═══════════════════════════════════════════
    async function initFile(file) {
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.82;
        const buf = await audioCtx.decodeAudioData(await file.arrayBuffer());
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.loop   = true;
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        src.start();
        go();
    }

    // ═══════════════════════════════════════════
    //  Audio — computer / system audio
    // ═══════════════════════════════════════════
    async function initSystemAudio() {
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.82;

        // getDisplayMedia requires video on most browsers; we drop it immediately
        const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { width: 1, height: 1, frameRate: 1 },
            audio: { echoCancellation: false, noiseSuppression: false, sampleRate: 44100 },
        });

        stream.getVideoTracks().forEach(t => t.stop());

        if (!stream.getAudioTracks().length) {
            throw new Error('no-audio');
        }

        audioCtx.createMediaStreamSource(stream).connect(analyser);
        go();
    }

    function go() {
        running = true;
        startEl.style.display = 'none';
        hudEl.classList.add('show');
        ctrlEl.classList.add('show');
        spawnParticles();
        fpsTs = performance.now();
        requestAnimationFrame(tick);
    }

    // ═══════════════════════════════════════════
    //  Beat detection
    // ═══════════════════════════════════════════
    function detectBeat(raw) {
        const end = Math.max(1, Math.floor(raw.length * 0.05));
        let sum = 0;
        for (let i = 0; i < end; i++) sum += raw[i];
        const cur = sum / end;

        beatBuf[beatHead] = cur;
        beatHead = (beatHead + 1) % BEAT_BUF;
        let avg = 0;
        for (let v of beatBuf) avg += v;
        avg /= BEAT_BUF;

        if (cur > avg * 1.38 && cur > 72 && !beatCool) {
            beatCool  = true;
            beatFlash = 1.0;
            setTimeout(() => { beatCool = false; }, 85);
        }
        beatFlash = Math.max(0, beatFlash - 0.052);
        return { cur, avg, flash: beatFlash };
    }

    // ═══════════════════════════════════════════
    //  Particles
    // ═══════════════════════════════════════════
    function spawnParticles() {
        const W = canvas.width, H = canvas.height;
        particles = Array.from({ length: 220 }, () => ({
            x:    Math.random() * W,
            y:    Math.random() * H,
            vx:   (Math.random() - 0.5) * 0.55,
            vy:   (Math.random() - 0.5) * 0.55,
            r:    Math.random() * 2.2 + 0.4,
            freq: Math.floor(Math.random() * 85),
            hue:  Math.random(),
        }));
    }

    function initTunnel() {
        tunnelZ = Array.from({length: 20}, (_, i) => (i + 0.5) / 20);
    }

    // ═══════════════════════════════════════════
    //  Color helpers
    // ═══════════════════════════════════════════
    function h2r(hex) {
        const n = parseInt(hex.slice(1), 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function lerpC(c1, c2, t) {
        const [r1,g1,b1] = h2r(c1), [r2,g2,b2] = h2r(c2);
        t = Math.max(0, Math.min(1, t));
        return `rgb(${~~(r1+(r2-r1)*t)},${~~(g1+(g2-g1)*t)},${~~(b1+(b2-b1)*t)})`;
    }

    function colorAt(t) {
        return t < 0.5 ? lerpC(theme.c1, theme.c2, t * 2) : lerpC(theme.c2, theme.c3, (t-0.5)*2);
    }

    // ═══════════════════════════════════════════
    //  Draw — Bars
    // ═══════════════════════════════════════════
    function drawBars(data, beat) {
        const W = canvas.width, H = canvas.height;
        const bins = Math.min(data.length, 110);
        const pad  = 1.2;
        const bw   = W / bins;

        ctx.shadowBlur = 10 + beat.flash * 8;

        for (let i = 0; i < bins; i++) {
            const t   = i / bins;
            const v   = (data[i] / 255) * sensitivity;
            const bh  = Math.min(v * H * 0.85, H * 0.92);
            const x   = i * bw;
            const col = colorAt(t);
            ctx.shadowColor = col;
            ctx.fillStyle   = col;
            rr(ctx, x + pad, H - bh, bw - pad * 2, bh, Math.min(bw * 0.22, 3));
            ctx.fill();
        }

        ctx.shadowBlur = 0;

        // Reflection
        ctx.save();
        ctx.globalAlpha = 0.11;
        ctx.scale(1, -1);
        ctx.translate(0, -H * 2);
        for (let i = 0; i < bins; i++) {
            const t   = i / bins;
            const v   = (data[i] / 255) * sensitivity;
            const bh  = Math.min(v * H * 0.85 * 0.22, H);
            const x   = i * bw;
            ctx.fillStyle = colorAt(t);
            ctx.fillRect(x + pad, H - bh, bw - pad * 2, bh);
        }
        ctx.restore();
    }

    // ═══════════════════════════════════════════
    //  Draw — Wave
    // ═══════════════════════════════════════════
    function drawWave(data, beat) {
        const W = canvas.width, H = canvas.height;
        const td  = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(td);
        const sl = W / td.length;

        function wavePath(scl, dy) {
            ctx.beginPath();
            for (let i = 0; i < td.length; i++) {
                const dev = ((td[i] / 128.0) - 1) * sensitivity * scl;
                const y   = H / 2 + dev * H * 0.42 + dy;
                i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * sl, y);
            }
        }

        // Primary
        ctx.lineWidth   = 2.4;
        ctx.strokeStyle = theme.c1;
        ctx.shadowColor = theme.c1;
        ctx.shadowBlur  = 16 + beat.flash * 14;
        wavePath(1, 0);
        ctx.stroke();

        // Secondary
        ctx.globalAlpha = 0.38;
        ctx.lineWidth   = 1.4;
        ctx.strokeStyle = theme.c2;
        ctx.shadowColor = theme.c2;
        ctx.shadowBlur  = 8;
        wavePath(0.55, 22);
        ctx.stroke();

        // Center hairline
        ctx.globalAlpha = 0.07;
        ctx.lineWidth   = 1;
        ctx.strokeStyle = '#fff';
        ctx.shadowBlur  = 0;
        ctx.beginPath();
        ctx.moveTo(0, H / 2);
        ctx.lineTo(W, H / 2);
        ctx.stroke();

        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Draw — Radial
    // ═══════════════════════════════════════════
    function drawRadial(data, beat) {
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2;
        const bins   = Math.min(data.length, 180);
        const minR   = Math.min(W, H) * (0.155 + beat.flash * 0.022);
        const maxR   = Math.min(W, H) * 0.44;
        const lw     = Math.max((Math.PI * 2 * minR) / bins * 0.72, 0.5);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(frame * 0.0014);

        ctx.lineWidth  = lw;
        ctx.shadowBlur = 9 + beat.flash * 7;

        for (let i = 0; i < bins; i++) {
            const angle = (i / bins) * Math.PI * 2;
            const v     = (data[i] / 255) * sensitivity;
            const r     = minR + v * (maxR - minR);
            const col   = colorAt(i / bins);
            ctx.strokeStyle = col;
            ctx.shadowColor = col;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * minR, Math.sin(angle) * minR);
            ctx.lineTo(Math.cos(angle) * r,    Math.sin(angle) * r);
            ctx.stroke();
        }

        // Inner glow ring
        ctx.shadowBlur   = 22 + beat.flash * 35;
        ctx.shadowColor  = theme.c1;
        ctx.strokeStyle  = theme.c1;
        ctx.lineWidth    = 1.5;
        ctx.globalAlpha  = 0.65 + beat.flash * 0.35;
        ctx.beginPath();
        ctx.arc(0, 0, minR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Draw — Nebula (particles)
    // ═══════════════════════════════════════════
    function drawNebula(data, beat) {
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2;
        const burstMul = 1 + beat.flash * 5;

        ctx.shadowBlur = 0;

        for (const p of particles) {
            const energy = (data[p.freq] / 255) * sensitivity;

            p.vx += (Math.random() - 0.5) * energy * 0.75 * burstMul;
            p.vy += (Math.random() - 0.5) * energy * 0.75 * burstMul;

            // Weak central attractor
            const dx = cx - p.x, dy = cy - p.y;
            const dist = Math.hypot(dx, dy);
            if (dist > 80) { p.vx += (dx / dist) * 0.045; p.vy += (dy / dist) * 0.045; }

            p.vx *= 0.962;
            p.vy *= 0.962;
            p.x  += p.vx;
            p.y  += p.vy;

            if (p.x < -60) p.x = W + 60;
            if (p.x > W + 60) p.x = -60;
            if (p.y < -60) p.y = H + 60;
            if (p.y > H + 60) p.y = -60;

            const t   = (p.hue + energy * 0.28) % 1;
            const col = colorAt(t);
            const sz  = p.r * (1 + energy * 2.8);

            ctx.beginPath();
            ctx.arc(p.x, p.y, sz, 0, Math.PI * 2);
            ctx.fillStyle   = col;
            ctx.shadowColor = col;
            ctx.shadowBlur  = sz * 5;
            ctx.globalAlpha = Math.min(1, 0.32 + energy * 0.68);
            ctx.fill();
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Draw — Fractal Tree
    // ═══════════════════════════════════════════
    function drawFractal(data, beat) {
        const W = canvas.width, H = canvas.height;

        function band(lo, hi) {
            let s = 0;
            for (let i = lo; i < hi; i++) s += data[i];
            return Math.min(1, (s / ((hi - lo) * 255)) * sensitivity);
        }

        const bass = band(0, 8);
        const mid  = band(8, 40);
        const high = band(40, 100);

        const maxD   = 8 + Math.floor(high * 2);       // 8-10 levels
        const spread = 0.28 + mid * 0.58;               // branch angle
        const ratio  = 0.58 + high * 0.14;              // branch length ratio
        const trunk  = H * 0.26 * (0.82 + bass * 0.35);
        const sway   = Math.sin(frame * 0.008) * 0.04 * (1 + mid * 0.5);

        // Use a single shadowBlur for performance
        ctx.shadowColor = theme.c2;
        ctx.shadowBlur  = 12;

        function br(x1, y1, ang, len, d) {
            if (d < 0 || len < 1.2) return;
            const x2 = x1 + Math.cos(ang) * len;
            const y2 = y1 + Math.sin(ang) * len;
            const t  = (maxD - d) / maxD;

            ctx.lineWidth   = Math.max(0.4, (d / maxD) * 4.5 * (1 + bass * 0.25));
            ctx.strokeStyle = colorAt(t);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            br(x2, y2, ang - spread, len * ratio, d - 1);
            br(x2, y2, ang + spread, len * ratio, d - 1);
        }

        // Canopy (upward tree)
        br(W / 2, H + 5, -Math.PI / 2 + sway, trunk, maxD);

        // Roots (mirrored downward, dimmed)
        ctx.globalAlpha = 0.22;
        ctx.shadowBlur  = 5;
        br(W / 2, -5, Math.PI / 2 - sway, trunk * 0.48, maxD - 2);
        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;

        // Beat root burst
        if (beat.flash > 0.05) {
            const g = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, trunk * 2.2);
            g.addColorStop(0, theme.c1 + Math.floor(beat.flash * 0x44).toString(16).padStart(2, '0'));
            g.addColorStop(1, 'transparent');
            ctx.fillStyle   = g;
            ctx.globalAlpha = beat.flash * 0.38;
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = 1;
        }
    }

    // ═══════════════════════════════════════════
    //  Draw — Depth Tunnel
    // ═══════════════════════════════════════════
    function drawTunnel(data, beat) {
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2;
        const SIDES = 6;
        const speed = 0.0026 + beat.flash * 0.022;

        // Advance each ring toward viewer, wrap when past
        for (let i = 0; i < tunnelZ.length; i++) {
            tunnelZ[i] -= speed;
            if (tunnelZ[i] < 0) tunnelZ[i] = 1;
        }

        // Painter's order: far (high z) first
        const sorted = tunnelZ.map((z, i) => ({z, i})).sort((a, b) => b.z - a.z);

        // Vanishing point glow
        const vg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 70);
        vg.addColorStop(0, theme.c1 + '20');
        vg.addColorStop(1, 'transparent');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);

        // Perspective lines from center (faint depth cues)
        ctx.globalAlpha = 0.04;
        ctx.strokeStyle = theme.c1;
        ctx.lineWidth   = 0.5;
        for (let j = 0; j < SIDES; j++) {
            const ang = (j / SIDES) * Math.PI * 2 + frame * 0.005;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(ang) * Math.max(W, H), cy + Math.sin(ang) * Math.max(W, H) * 0.9);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;

        ctx.save();
        ctx.translate(cx, cy);

        for (const {z, i} of sorted) {
            const near = 1 - z;                         // 0=far, 1=near
            const sz   = near * Math.min(W, H) * 0.58;
            if (sz < 2) continue;

            const binIdx = Math.min(Math.floor(z * 80), data.length - 1);
            const energy = (data[binIdx] / 255) * sensitivity;

            const col = colorAt((i / tunnelZ.length + frame * 0.002) % 1);

            ctx.strokeStyle = col;
            ctx.lineWidth   = 0.6 + near * 2.8 + energy * 2.2;
            ctx.shadowColor = col;
            ctx.shadowBlur  = 4 + near * 16 + energy * 18;
            ctx.globalAlpha = near * near * (0.36 + energy * 0.64);

            ctx.beginPath();
            for (let j = 0; j <= SIDES; j++) {
                const ang  = (j / SIDES) * Math.PI * 2 + frame * 0.005;
                const warp = 1 + energy * 0.32 * Math.sin(j * 2.5 + frame * 0.06);
                const r    = sz / 2 * warp;
                j === 0
                    ? ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r * 0.9)
                    : ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r * 0.9);
            }
            ctx.closePath();
            ctx.stroke();
        }

        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Draw — Liquid Glass Sphere
    // ═══════════════════════════════════════════
    function drawSphere(data, beat) {
        const W = canvas.width, H = canvas.height;
        const cx = W / 2, cy = H / 2;

        // Frequency band energy from pre-scaled data (already sensitivity-adjusted)
        function band(lo, hi) {
            let s = 0;
            for (let i = lo; i < hi; i++) s += data[i];
            return Math.min(1, s / ((hi - lo) * 255));
        }

        const bass = band(0, 8);
        const mid  = band(8, 40);
        const high = band(40, 100);

        // Sphere radius — pulses gently on beat
        const r = Math.min(W, H) * 0.3 * (1 + beat.flash * 0.03);

        // Helper: inject alpha into an rgb() string from colorAt()
        const ca = (col, a) => col.replace('rgb(', 'rgba(').replace(')', `,${+a.toFixed(3)})`);

        // ── 1. Outer reactive halo ──────────────
        const haloR = r * (1.1 + bass * 0.16 + beat.flash * 0.08);
        const haloG = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, haloR);
        haloG.addColorStop(0,   ca(colorAt(0),   0.28 + bass * 0.3));
        haloG.addColorStop(0.4, ca(colorAt(0.5), 0.1  + mid  * 0.1));
        haloG.addColorStop(1,   'transparent');
        ctx.fillStyle = haloG;
        ctx.beginPath();
        ctx.arc(cx, cy, haloR, 0, Math.PI * 2);
        ctx.fill();

        // ── 2. Dark glass interior ──────────────
        const bgG = ctx.createRadialGradient(cx + r * 0.1, cy - r * 0.12, 0, cx, cy, r);
        bgG.addColorStop(0,    'rgba(14,14,38,0.93)');
        bgG.addColorStop(0.62, 'rgba(7,7,20,0.97)');
        bgG.addColorStop(1,    'rgba(2,2,10,1)');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = bgG;
        ctx.fill();

        // ── 3. Inner content (sphere clip) ──────
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
        ctx.clip();

        // Color orbs — 6 blobs, each tied to a frequency band, additively blended
        ctx.globalCompositeOperation = 'screen';
        for (let i = 0; i < 6; i++) {
            const e   = band(Math.floor(i / 6 * 80), Math.floor((i + 1) / 6 * 80));
            const ang = (i / 6) * Math.PI * 2 + frame * 0.004 * (i % 2 ? -1.4 : 1);
            const bx  = cx + Math.cos(ang) * r * (0.15 + e * 0.35);
            const by  = cy + Math.sin(ang) * r * (0.15 + e * 0.35) * 0.86;
            const br  = r  * (0.22 + e * 0.32);
            const col = colorAt((i / 6 + frame * 0.0008) % 1);

            const og = ctx.createRadialGradient(bx, by, 0, bx, by, br);
            og.addColorStop(0,   ca(col, 0.62 + e * 0.38));
            og.addColorStop(0.5, ca(col, 0.16 + e * 0.18));
            og.addColorStop(1,   'transparent');
            ctx.fillStyle = og;
            ctx.beginPath();
            ctx.arc(bx, by, br, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';

        // Radial frequency cage — 64 spokes from center outward
        ctx.shadowColor = theme.c1;
        ctx.shadowBlur  = 5;
        for (let i = 0; i < 64; i++) {
            const ang  = (i / 64) * Math.PI * 2;
            const e    = data[Math.min(Math.floor((i / 64) * 80), data.length - 1)] / 255;
            const sr   = r * 0.1 + e * r * 0.72;
            const col  = colorAt(i / 64);
            ctx.strokeStyle = col;
            ctx.shadowColor = col;
            ctx.lineWidth   = 1.0;
            ctx.globalAlpha = 0.4 + e * 0.6;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang) * r * 0.1, cy + Math.sin(ang) * r * 0.1);
            ctx.lineTo(cx + Math.cos(ang) * sr,       cy + Math.sin(ang) * sr);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;

        // Beat central flash — radial burst from center
        if (beat.flash > 0.04) {
            const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            fg.addColorStop(0,   ca(colorAt(0),   beat.flash * 0.7));
            fg.addColorStop(0.4, ca(colorAt(0.5), beat.flash * 0.2));
            fg.addColorStop(1,   'transparent');
            ctx.fillStyle = fg;
            ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
        }

        ctx.restore(); // end sphere clip

        // ── 4. Glass surface curvature overlay ──
        const sfG = ctx.createRadialGradient(cx - r * 0.15, cy - r * 0.15, 0, cx, cy, r);
        sfG.addColorStop(0,    'rgba(255,255,255,0)');
        sfG.addColorStop(0.54, 'rgba(255,255,255,0.012)');
        sfG.addColorStop(0.82, 'rgba(255,255,255,0.036)');
        sfG.addColorStop(0.93, 'rgba(255,255,255,0.1)');
        sfG.addColorStop(1,    'rgba(255,255,255,0.22)');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = sfG;
        ctx.fill();

        // ── 5. Primary specular highlight ───────
        // Upper-left bright catchlight — the defining "glass sphere" element
        const sp1x = cx - r * 0.33, sp1y = cy - r * 0.37;
        const sp1G = ctx.createRadialGradient(sp1x, sp1y, 0, sp1x, sp1y, r * 0.44);
        sp1G.addColorStop(0,    'rgba(255,255,255,0.92)');
        sp1G.addColorStop(0.18, 'rgba(255,255,255,0.5)');
        sp1G.addColorStop(0.52, 'rgba(255,255,255,0.08)');
        sp1G.addColorStop(1,    'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = sp1G;
        ctx.fill();

        // ── 6. Secondary specular (lower-right) ─
        const sp2x = cx + r * 0.44, sp2y = cy + r * 0.38;
        const sp2G = ctx.createRadialGradient(sp2x, sp2y, 0, sp2x, sp2y, r * 0.21);
        sp2G.addColorStop(0,   'rgba(255,255,255,0.2)');
        sp2G.addColorStop(0.5, 'rgba(255,255,255,0.05)');
        sp2G.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = sp2G;
        ctx.fill();

        // ── 7. Fresnel rim — Liquid Glass edge ──
        // Darkens toward center of edge, brightens at the very rim (physically accurate)
        const rimG = ctx.createRadialGradient(cx, cy, r * 0.78, cx, cy, r);
        rimG.addColorStop(0,    'transparent');
        rimG.addColorStop(0.58, 'rgba(255,255,255,0.008)');
        rimG.addColorStop(0.86, ca(colorAt(0),   0.1 + bass * 0.08));
        rimG.addColorStop(0.95, ca(colorAt(0.5), 0.14 + mid  * 0.06));
        rimG.addColorStop(1,    'rgba(255,255,255,0.2)');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = rimG;
        ctx.fill();

        // ── 8. Frequency-distorted reactive outline
        // Each point on the sphere border is displaced outward by its frequency bin,
        // making the surface ripple like liquid glass
        ctx.beginPath();
        for (let i = 0; i <= 240; i++) {
            const ang  = (i / 240) * Math.PI * 2;
            const e    = data[Math.min(Math.floor((i / 240) * 60), data.length - 1)] / 255;
            const dist = r * (1.006 + e * 0.058 * (1 + beat.flash * 2.5));
            i === 0
                ? ctx.moveTo(cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist)
                : ctx.lineTo(cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist);
        }
        ctx.closePath();
        ctx.strokeStyle = ca(colorAt(0), 0.55);
        ctx.lineWidth   = 1.5;
        ctx.shadowColor = theme.c1;
        ctx.shadowBlur  = 16 + beat.flash * 30 + bass * 18;
        ctx.stroke();
        ctx.shadowBlur  = 0;
    }

    // ═══════════════════════════════════════════
    //  Rounded rect helper
    // ═══════════════════════════════════════════
    function rr(c, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y,     x + w, y + h, r);
        c.arcTo(x + w, y + h, x,     y + h, r);
        c.arcTo(x,     y + h, x,     y,     r);
        c.arcTo(x,     y,     x + w, y,     r);
        c.closePath();
    }

    // ═══════════════════════════════════════════
    //  Main animation loop
    // ═══════════════════════════════════════════
    function tick(ts) {
        if (!running) return;
        requestAnimationFrame(tick);
        frame++;

        // FPS
        fpsCount++;
        if (ts - fpsTs >= 1000) {
            fps      = fpsCount;
            fpsCount = 0;
            fpsTs    = ts;
        }

        const bufLen = analyser.frequencyBinCount;
        const raw    = new Uint8Array(bufLen);
        analyser.getByteFrequencyData(raw);

        const beat = detectBeat(raw);

        // Scale data for drawing
        const data = new Uint8Array(bufLen);
        for (let i = 0; i < bufLen; i++) data[i] = Math.min(255, raw[i] * sensitivity);

        if (useGLMode()) {
            const bass = bandEnergy(data, 0, 8);
            const mid  = bandEnergy(data, 8, 40);
            const high = bandEnergy(data, 40, 100);
            renderGL(mode === 'tunnel' ? 1 : 0, bass, mid, high, beat.flash);
        } else {
            const W = canvas.width, H = canvas.height;

            // Background — nebula trails; tunnel uses hard clear (rings draw their own depth)
            if (mode === 'nebula') {
                ctx.fillStyle   = theme.bg;
                ctx.globalAlpha = 0.14;
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            } else {
                ctx.fillStyle = theme.bg;
                ctx.fillRect(0, 0, W, H);
            }

            // Beat flash overlay
            if (beat.flash > 0.01) {
                const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.62);
                g.addColorStop(0, theme.c1 + '22');
                g.addColorStop(1, 'transparent');
                ctx.fillStyle   = g;
                ctx.globalAlpha = beat.flash * 0.55;
                ctx.fillRect(0, 0, W, H);
                ctx.globalAlpha = 1;
            }

            // Draw active mode
            switch (mode) {
                case 'bars':    drawBars(data, beat);    break;
                case 'wave':    drawWave(data, beat);    break;
                case 'radial':  drawRadial(data, beat);  break;
                case 'nebula':  drawNebula(data, beat);  break;
                case 'fractal': drawFractal(data, beat); break;
                case 'tunnel':  drawTunnel(data, beat);  break;
                case 'sphere':  drawSphere(data, beat);  break;
            }
        }

        // HUD update
        let avg = 0;
        for (let v of raw) avg += v;
        avg = Math.round(avg / raw.length);
        hudStats.textContent =
            `Level: ${avg} · Bass: ${Math.round(beat.cur)} · ${fps} fps`;
    }

    // ═══════════════════════════════════════════
    //  Start-screen particle background
    // ═══════════════════════════════════════════
    (function startBg() {
        const sc   = document.getElementById('start-canvas');
        const sctx = sc.getContext('2d');
        let pts = [];
        let t = 0;

        function resizeSc() { sc.width = window.innerWidth; sc.height = window.innerHeight; }
        resizeSc();
        window.addEventListener('resize', resizeSc);

        for (let i = 0; i < 55; i++) {
            pts.push({
                x:   Math.random() * sc.width,
                y:   Math.random() * sc.height,
                vx:  (Math.random() - 0.5) * 0.38,
                vy:  (Math.random() - 0.5) * 0.38,
                r:   Math.random() * 2 + 0.4,
                hue: Math.random(),
            });
        }

        function drawStart() {
            if (startEl.style.display === 'none') return;
            requestAnimationFrame(drawStart);
            t += 0.007;
            sctx.clearRect(0, 0, sc.width, sc.height);

            for (const p of pts) {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > sc.width)  p.vx *= -1;
                if (p.y < 0 || p.y > sc.height)  p.vy *= -1;

                const a   = 0.18 + Math.sin(t + p.hue * 6) * 0.08;
                const col = p.hue < 0.5 ? `rgba(0,255,255,${a})` : `rgba(255,0,255,${a})`;

                sctx.beginPath();
                sctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                sctx.fillStyle   = col;
                sctx.shadowColor = col;
                sctx.shadowBlur  = 7;
                sctx.fill();
            }

            sctx.shadowBlur = 0;
            for (let i = 0; i < pts.length; i++) {
                for (let j = i + 1; j < pts.length; j++) {
                    const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
                    if (d < 115) {
                        sctx.beginPath();
                        sctx.moveTo(pts[i].x, pts[i].y);
                        sctx.lineTo(pts[j].x, pts[j].y);
                        sctx.strokeStyle = `rgba(0,255,255,${(1 - d / 115) * 0.1})`;
                        sctx.lineWidth   = 0.5;
                        sctx.stroke();
                    }
                }
            }
        }
        drawStart();
    })();

    // ═══════════════════════════════════════════
    //  UI — mode buttons
    // ═══════════════════════════════════════════
    function setMode(m) {
        mode = m;
        if (mode === 'nebula')  spawnParticles();
        if (mode === 'tunnel' && !glReady) initTunnel();
        document.querySelectorAll('[data-mode]').forEach(b => {
            b.classList.toggle('on', b.dataset.mode === m);
        });
        updateCanvasVisibility();
    }

    document.querySelectorAll('[data-mode]').forEach(b =>
        b.addEventListener('click', () => setMode(b.dataset.mode)));

    // ═══════════════════════════════════════════
    //  UI — theme dots
    // ═══════════════════════════════════════════
    function setTheme(i) {
        themeIdx = i;
        theme    = THEMES[i];
        applyTheme();
        document.querySelectorAll('[data-t]').forEach((b, idx) =>
            b.classList.toggle('on', idx === i));
    }

    document.querySelectorAll('[data-t]').forEach((b, i) =>
        b.addEventListener('click', () => setTheme(i)));

    // ═══════════════════════════════════════════
    //  UI — sensitivity slider
    // ═══════════════════════════════════════════
    sensSlider.addEventListener('input', () => {
        sensitivity = sensSlider.value / 100;
        sensVal.textContent = sensitivity.toFixed(1) + '×';
    });

    // ═══════════════════════════════════════════
    //  UI — fullscreen
    // ═══════════════════════════════════════════
    document.getElementById('fs-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen();
        }
    });

    // ═══════════════════════════════════════════
    //  UI — audio init buttons
    // ═══════════════════════════════════════════
    document.getElementById('mic-btn').addEventListener('click', async () => {
        try {
            await initMic();
        } catch (e) {
            alert(
                'Microphone access denied or unavailable.\n\n' +
                'Make sure this page is served from localhost (run: npm run viz)\n' +
                'and that browser microphone permission is granted.'
            );
        }
    });

    document.getElementById('sys-btn').addEventListener('click', async () => {
        if (!navigator.mediaDevices?.getDisplayMedia) {
            alert('Screen audio capture is not supported in this browser.\nTry Chrome or Edge on desktop.');
            return;
        }
        try {
            await initSystemAudio();
        } catch (e) {
            if (e.name === 'NotAllowedError' || e.name === 'AbortError') return; // user cancelled
            if (e.message === 'no-audio') {
                alert(
                    'No audio was captured.\n\n' +
                    'In the sharing dialog:\n' +
                    '  • Browser tab → check "Share tab audio"\n' +
                    '  • Entire screen → enable "Share system audio"\n' +
                    '    (system audio works on Windows and ChromeOS)'
                );
            } else {
                alert('Could not capture audio: ' + (e.message ?? 'Unknown error'));
            }
        }
    });

    document.getElementById('file-input').addEventListener('change', async e => {
        if (!e.target.files[0]) return;
        try {
            await initFile(e.target.files[0]);
        } catch {
            alert('Could not decode this audio file. Try MP3, WAV, or OGG.');
        }
    });

    // ═══════════════════════════════════════════
    //  Keyboard shortcuts
    // ═══════════════════════════════════════════
    document.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if      (k === '1') setMode('bars');
        else if (k === '2') setMode('wave');
        else if (k === '3') setMode('radial');
        else if (k === '4') setMode('nebula');
        else if (k === '5') setMode('fractal');
        else if (k === '6') setMode('tunnel');
        else if (k === '7') setMode('sphere');
        else if (k === 'q') setTheme(0);
        else if (k === 'w') setTheme(1);
        else if (k === 'e') setTheme(2);
        else if (k === 'r') setTheme(3);
        else if (k === 't') setTheme(4);
        else if (k === 'f') document.getElementById('fs-btn').click();
        else if (k === '+' || k === '=') {
            sensSlider.value = Math.min(+sensSlider.value + 10, sensSlider.max);
            sensSlider.dispatchEvent(new Event('input'));
        } else if (k === '-') {
            sensSlider.value = Math.max(+sensSlider.value - 10, sensSlider.min);
            sensSlider.dispatchEvent(new Event('input'));
        }
    });

    // ═══════════════════════════════════════════
    //  Auto-hide controls on mouse idle
    // ═══════════════════════════════════════════
    let idleTimer;
    function wake() {
        document.body.classList.remove('idle');
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => document.body.classList.add('idle'), 3200);
    }
    ['mousemove', 'click', 'keydown', 'touchstart'].forEach(ev =>
        document.addEventListener(ev, wake));
    wake();
    </script>
</body>
</html>
